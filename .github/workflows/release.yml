name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The tag push runs exactly the checks CI runs before an image is built
  # and pushed: vet, race tests, staticcheck, the integration test and the
  # compose smoke test.
  test:
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    runs-on: ubuntu-26.04
    outputs:
      latest: ${{ steps.meta.outputs.latest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The :latest decision compares tags; the whole history is needed.
          fetch-depth: 0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        # Tags, labels and annotations come from one script, which CI runs
        # too (the image metadata step there). The tag name goes through
        # the environment, never into the script text: a tag can contain
        # shell syntax; the script checks its semver shape first.
        env:
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          OUT_DIR="$(mktemp -d)"
          export OUT_DIR
          .github/scripts/image-meta.sh
          {
            echo "tags=$(cat "$OUT_DIR/tags")"
            echo "latest=$(cat "$OUT_DIR/latest")"
            echo "labels<<EOF_META"
            cat "$OUT_DIR/labels"
            echo "EOF_META"
            echo "annotations<<EOF_META"
            cat "$OUT_DIR/annotations"
            echo "EOF_META"
          } >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ github.ref_name }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/andrius/dev-lease
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Once the image is published, the README and the example compose files
  # name the new tag: one commit to main, for the tag :latest moved to
  # (the highest non-pre-release tag) and only then. A push made with the
  # workflow token starts no workflow, so the job starts CI on main itself.
  docs:
    needs: image
    if: needs.image.outputs.latest == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          # The job pushes the bump commit with the workflow token.
          persist-credentials: true
      - name: point the docs at the new tag and start CI on main
        env:
          REF: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          out="$(.github/scripts/release-docs-bump.sh)"
          echo "$out"
          if [ "$out" = pushed ]; then
            gh workflow run ci.yml --ref main
          fi
